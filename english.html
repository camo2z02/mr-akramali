<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So’z yodlash</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#1d2033;--muted:#6b7089;--accent:#4f46e5;--accent-t:#fff;--ok:#16a34a;--bad:#dc2626;--line:#e3e5f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1d1f2e;--text:#eceefa;--muted:#9a9eb8;--accent:#818cf8;--accent-t:#12131c;--ok:#4ade80;--bad:#f87171;--line:#2d3047;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131c;--card:#1d1f2e;--text:#eceefa;--muted:#9a9eb8;--accent:#818cf8;--accent-t:#12131c;--ok:#4ade80;--bad:#f87171;--line:#2d3047;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 12px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.lv b{display:block;font-size:20px}
.lv span{color:var(--muted);font-size:13px}
.lv:active{transform:scale(.97)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.prog{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.word{font-size:38px;font-weight:700;word-break:break-word}
.ans{font-size:24px;color:var(--accent);font-weight:600;min-height:30px}
.spk{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.msg{min-height:26px;margin:12px 0 0;text-align:center;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:10px}.nav .btn{flex:1}
.modes{display:grid;gap:12px}.modes .lv{padding:18px 14px}.modes .lv span{display:block;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.bar{display:flex;justify-content:flex-end;margin-bottom:4px}
.gear{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--text)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel[hidden]{display:none}
.panel h2{font-size:17px;margin:0 0 12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.seg{display:flex;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:25px}
input.wrong{border-color:var(--bad)}
.essay{margin-top:22px;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:14px 16px}
.essay small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.essay b{display:block;font-size:16px;line-height:1.4}
.essay span{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.essay{cursor:pointer}
.essay em{display:block;margin-top:8px;font-style:normal;color:var(--accent);font-size:13px;font-weight:600}
textarea{width:100%;min-height:260px;font:inherit;font-size:16px;line-height:1.5;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);resize:vertical}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.meter i.full{background:var(--ok)}
.wcnt{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.res{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;white-space:pre-wrap;line-height:1.55;font-size:15px}
.res[hidden]{display:none}
.res .st{color:var(--accent);font-weight:600}
.timerbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px}
.timerbar span{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.timerbar .btn[hidden]{display:none}
textarea:disabled{opacity:.6}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.rd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.rd b{display:block;font-size:15px}.rd span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.rd:active{transform:scale(.97)}
.passage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;line-height:1.65;font-size:16px;margin-top:10px}
.passage h2{font-size:19px;margin:0 0 10px}.passage p{margin:0 0 12px}.passage p:last-child{margin:0}
.q{margin-top:18px}.q>b{display:block;line-height:1.45;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.why{color:var(--muted);font-size:14px;line-height:1.5;margin:2px 0 0}
.score{font-size:20px;font-weight:700;text-align:center;margin-top:18px}
.sl{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px}
.sl.ok,input.tx.ok{border-color:var(--ok)}.sl.bad,input.tx.bad{border-color:var(--bad)}
input.tx{width:100%;flex:none}

/* ===== ANIMATSIYALAR (faqat ko'rinish; funksiyalar o'zgarmagan) ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}

/* Orqa fon: sekin suzuvchi ikki rangli nur */
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;width:60vmax;height:60vmax}
body::before{top:-26vmax;left:-22vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 65%);animation:orbA 20s ease-in-out infinite alternate}
body::after{bottom:-30vmax;right:-24vmax;background:radial-gradient(circle,color-mix(in srgb,var(--ok) 14%,transparent),transparent 65%);animation:orbB 26s ease-in-out infinite alternate}
@keyframes orbA{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes orbB{to{transform:translate(-12vmax,-9vmax) scale(1.1)}}

/* Ekran almashganda kirish */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.94) rotate(-.6deg)}}
@keyframes wordIn{from{opacity:0;transform:translateY(10px);filter:blur(5px)}}
@keyframes ansIn{from{opacity:0;transform:scale(.8)}}
@keyframes okPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 38%,transparent)}70%,100%{box-shadow:0 0 0 16px transparent}}
@keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes scoreIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rip{to{transform:scale(1);opacity:0}}

#app>*{animation:rise .5s var(--ease) backwards}
#app>*:nth-child(2){animation-delay:0.04s}#app>*:nth-child(3){animation-delay:0.08s}#app>*:nth-child(4){animation-delay:0.12s}#app>*:nth-child(5){animation-delay:0.16s}#app>*:nth-child(6){animation-delay:0.20s}#app>*:nth-child(7){animation-delay:0.24s}#app>*:nth-child(8){animation-delay:0.28s}
#app>*:nth-child(n+9){animation:none}
#app>.levels,#app>.modes,#app>.reads{animation:none}
#app>.card{animation:cardIn .6s var(--spring) .04s backwards}
#app>.score{animation:scoreIn .7s var(--spring) .1s backwards}
.levels>.lv,.modes>.lv,.reads>.rd{animation:pop .5s var(--spring) .08s backwards}
.levels>.lv:nth-child(1){animation-delay:0.09s}.levels>.lv:nth-child(2){animation-delay:0.12s}.levels>.lv:nth-child(3){animation-delay:0.15s}.levels>.lv:nth-child(4){animation-delay:0.18s}.levels>.lv:nth-child(5){animation-delay:0.21s}.levels>.lv:nth-child(6){animation-delay:0.24s}.levels>.lv:nth-child(7){animation-delay:0.27s}.levels>.lv:nth-child(8){animation-delay:0.30s}.levels>.lv:nth-child(9){animation-delay:0.33s}.levels>.lv:nth-child(10){animation-delay:0.36s}.levels>.lv:nth-child(11){animation-delay:0.39s}.levels>.lv:nth-child(12){animation-delay:0.42s}.levels>.lv:nth-child(13){animation-delay:0.45s}.levels>.lv:nth-child(14){animation-delay:0.48s}.levels>.lv:nth-child(15){animation-delay:0.51s}.levels>.lv:nth-child(16){animation-delay:0.54s}.levels>.lv:nth-child(17){animation-delay:0.57s}.levels>.lv:nth-child(18){animation-delay:0.60s}.levels>.lv:nth-child(19){animation-delay:0.63s}.levels>.lv:nth-child(20){animation-delay:0.66s}.modes>.lv:nth-child(1){animation-delay:0.17s}.modes>.lv:nth-child(2){animation-delay:0.24s}.modes>.lv:nth-child(3){animation-delay:0.31s}.modes>.lv:nth-child(4){animation-delay:0.38s}.modes>.lv:nth-child(5){animation-delay:0.45s}.reads>.rd:nth-child(1){animation-delay:0.26s}.reads>.rd:nth-child(2){animation-delay:0.32s}.reads>.rd:nth-child(3){animation-delay:0.38s}.reads>.rd:nth-child(4){animation-delay:0.44s}
.word{animation:wordIn .55s var(--ease) .14s backwards}
.ans:not(:empty){animation:ansIn .5s var(--spring) backwards}
.spk{animation:ring 2.2s ease-out .8s 3}
.panel{transform-origin:top right}
.panel:not([hidden]){animation:drop .35s var(--ease)}
.res:not([hidden]){animation:rise .4s var(--ease)}

/* Bosish va ustiga borish */
.btn,.lv,.rd,.opt,.gear,.spk,.seg button,.essay{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.btn,.lv,.rd,.opt,.gear,.spk,.seg button,.essay,input,textarea,.sl{transition:transform .28s var(--spring),box-shadow .25s,border-color .2s,background-color .2s,color .2s,opacity .2s,filter .2s}
.lv b{transition:color .2s}
.sw{transition:background-color .25s}
.sw::after{transition:left .28s var(--spring)}
@media (hover:hover){
  .lv:hover,.rd:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
  .lv:hover b{color:var(--accent)}
  .btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost:not(:disabled):hover{border-color:var(--accent)}
  .opt:hover{border-color:var(--accent);transform:translateX(3px)}
  .gear:hover{transform:rotate(60deg)}
  .spk:hover{transform:scale(1.1)}
  .essay:hover{border-color:var(--accent);transform:translateY(-2px)}
  .seg button:hover{border-color:var(--accent)}
}
.lv:active,.rd:active,.btn:active,.opt:active,.spk:active,.gear:active,.essay:active,.seg button:active{transform:scale(.96)}
input:focus,textarea:focus,.sl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
input.wrong,input.wrong:focus{border-color:var(--bad)}
input.wrong:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 20%,transparent)}

/* Javob natijalari */
.msg.ok{animation:okPop .5s var(--spring)}
.msg.bad{animation:shakeX .45s}
.opt.ok{animation:okPop .5s var(--spring)}
.opt.bad{animation:shakeX .45s}
.sl.ok,input.tx.ok{animation:glow .8s ease-out}
.sl.bad,input.tx.bad{animation:shakeX .45s}

/* Progress: yengil yaltirash */
.meter i{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);background-size:200% 100%;animation:sheen 2.2s linear infinite}

/* Bosilganda to'lqin */
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s ease-out forwards}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

/* ===== v2 animatsiyalar (yanada jonli) ===== */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes sweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(230%)}}
@keyframes sweepH{from{transform:translateX(-130%)}to{transform:translateX(230%)}}
@keyframes charIn{from{opacity:0;transform:translateY(.8em) rotate(10deg) scale(.5)}}
@keyframes titleShine{0%,50%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes flipIn{from{opacity:0;transform:perspective(700px) rotateX(-65deg) translateY(24px) scale(.92)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(12deg) scale(1.1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes floatUp{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}15%{opacity:.55}100%{transform:translate3d(var(--dx,20px),-115vh,0) scale(1.1);opacity:0}}
@keyframes tickPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Sarlavha: vaqti-vaqti bilan yaltirab o'tadi */
#app>h1,#app>h1:nth-child(n){background:linear-gradient(100deg,var(--text) 38%,var(--accent) 50%,var(--text) 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:rise .5s var(--ease) backwards,titleShine 5s ease-in-out 1.2s infinite}

/* Karta: 3D ag'darilib kiradi va sekin tebranib turadi */
#app>.card{animation:flipIn .75s var(--spring) .04s backwards,bob 5s ease-in-out .9s infinite}
.ch{display:inline-block;animation:charIn .65s var(--spring) backwards;animation-delay:calc(var(--i)*45ms + 160ms)}

/* Orqa fon: parallaks + suzuvchi zarralar */
body::before,body::after{transition:translate .8s ease-out}
body::before{translate:calc(var(--px,0)*-34px) calc(var(--py,0)*-34px)}
body::after{translate:calc(var(--px,0)*28px) calc(var(--py,0)*28px)}
.fx-layer{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.fx-layer i{position:absolute;bottom:-20px;border-radius:50%;background:color-mix(in srgb,var(--accent) 40%,transparent);animation:floatUp linear infinite}

/* Yaltirash va tebranish */
.btn:not(.ghost)::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.38) 50%,transparent 60%);transform:translateX(-130%);animation:sweep 4.5s ease-in-out 1.2s infinite;pointer-events:none}
.lv::after,.rd::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--accent) 20%,transparent) 50%,transparent 60%);transform:translateX(-130%);pointer-events:none}
@media (hover:hover){.lv:hover::after,.rd:hover::after{animation:sweepH .8s ease}}
#app>.modes>.lv::after{animation:sweep 7s ease-in-out 2s infinite}
#app>.modes>.lv:nth-child(1)::after{animation-delay:2.7s}#app>.modes>.lv:nth-child(2)::after{animation-delay:3.9s}#app>.modes>.lv:nth-child(3)::after{animation-delay:5.1s}
.gear{animation:spinSlow 16s linear infinite}
.gear:hover{animation-duration:2.5s}
.spk:hover{animation:wiggle .55s ease}
.essay em{animation:nudge 1.8s ease-in-out infinite}
@media (hover:hover){
  .lv:hover,.rd:hover{transform:perspective(700px) translateY(-3px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
}
@media (prefers-reduced-motion:reduce){.ch{animation:none!important}.fx-layer{display:none}}

.credit{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.04em;margin-top:28px;padding-bottom:8px;animation:rise .8s var(--ease) .6s backwards}

/* mywords-section: "Mening so'zlarim" bo'limi */
@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
@keyframes mwNew{0%{transform:scale(.85);opacity:0;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1);box-shadow:0 0 0 14px transparent}}
.dots{display:inline-flex;gap:5px;vertical-align:middle;margin-left:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dotb 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.mw-res{margin-top:12px;margin-bottom:0;animation:rise .4s var(--ease)}
.mw-load{margin-top:12px;color:var(--muted);text-align:center;padding:10px}
.mw-dir{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.mw-src{display:flex;align-items:center;gap:10px;font-size:22px;margin-bottom:10px;word-break:break-word}
.mw-res input{width:100%;flex:none}
.mw-res .why{margin:8px 0 0}
.lv:disabled{opacity:.45;pointer-events:none}
.mw-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;transition:opacity .25s,transform .25s var(--ease),border-color .2s;animation:pop .4s var(--spring) backwards}
.mw-item.out{opacity:0;transform:translateX(34px)}
.mw-item.new{animation:mwNew .8s var(--spring);border-color:var(--ok)}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mw-w{font-size:17px;word-break:break-word}
.mw-t{color:var(--accent);font-weight:600;word-break:break-word}
.mw-b{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font-size:15px;transition:transform .2s var(--spring),border-color .2s,color .2s}
.mw-b:hover{transform:scale(1.12);border-color:var(--accent)}
.mw-b.x:hover{border-color:var(--bad);color:var(--bad)}
.mw-b:active{transform:scale(.9)}
</style>
</head>
<body>
<div class="wrap"><div class="bar"><button class="gear" id="gear" aria-label="Settings">⚙️</button></div><div class="panel" id="panel" hidden></div><div id="app"></div><div class="credit">by Akramali</div></div>
<script>

var AC = null;
function tone(f, start, dur, type, vol){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    var o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + start;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e) {}
}

    case "headings": return "The passage must have exactly 5 paragraphs. Then write exactly 5 questions, one per paragraph: q is \"Paragraph A\" ... \"Paragraph E\". Every question has the same 7 options (5 correct headings plus 2 extra wrong ones, in shuffled order) and \"answer\" is the index of that paragraph's heading.";
    case "matchinfo": return "The passage must have exactly 5 paragraphs. Then write exactly 5 questions of the form \"Which paragraph mentions ...?\". Every question's options are exactly [\"A\",\"B\",\"C\",\"D\",\"E\"].";
    case "matchfeat": return "The passage must present the views or experiences of exactly 3 named people. Then write exactly 5 statements as questions (q is the statement, e.g. \"Who says that ...?\"). Every question's options are the 3 names.";
    case "gapped": return "In the passage, remove exactly 4 sentences and mark each gap in the text as [1], [2], [3], [4]. Then write exactly 4 questions: q is \"Gap [1]\" etc. Every question has the same 5 options: the 4 removed sentences plus 1 extra sentence that fits nowhere, in shuffled order.";
    case "sentcomp": return "Then write exactly 6 sentence-completion questions. Each q is a sentence about the passage with a blank _____ and the answer is NO MORE THAN TWO WORDS taken from the passage. " + TX;
    case "summary": return "Then write a summary of the passage split into exactly 6 questions: each q is one sentence of the summary containing a blank ______, and the answer is NO MORE THAN TWO WORDS from the passage. " + TX;
    default: return "Then write exactly 5 short-answer questions answerable with NO MORE THAN THREE words from the passage. " + TX;
  }
}

function readPrompt(kind, task){
  var topicR = RTOPICS[Math.floor(Math.random() * RTOPICS.length)];
  var ws = shuffle(WORDS[level]).slice(0, 6).map(function(x){ return x.w; }).join(", ");
  var uz = S.lang === "uz", head;
  if(kind === "cefr"){
    var c = CEFRL[level - 1];
    head = "Write an ORIGINAL reading passage in the style of a CEFR " + c + " reading exam. Length: " + CEFRLEN[c] + " words.";
  } else {
    head = "Write an ORIGINAL academic reading passage in the style of IELTS Academic Reading, target difficulty band " + IELTSB[level - 1] + ". Length: 350-450 words.";
  }
  return head + " Do not copy any real exam text. Topic: " + topicR + ". If it fits naturally, use some of these words: " + ws + ".\n" + taskSpec(task, kind)
    + "\nReturn ONLY valid JSON with no markdown and no extra text, in this exact shape: {\"title\": string, \"text\": string (paragraphs separated by \\n\\n), \"questions\": [{\"q\": string, \"options\": [string] (omit for typed-answer tasks), \"answer\": number (0-based index) or, for typed-answer tasks, an array of strings, \"why\": string}]}."
    + " Options must not start with letters like A) or B). The \"why\" is one short sentence in " + (uz ? "Uzbek" : "English") + " explaining the correct answer.";
}

async function readStart(kind, pick){
  var id = Date.now();
  var task = pick === "mix" ? TASKS[kind][Math.floor(Math.random() * TASKS[kind].length)] : pick;
  RD = { kind: kind, pick: pick, task: task, id: id, data: null, sel: [], checked: false, err: "" };
  readView();
  var sample = null;
  try { sample = (window.claude && claude.use) ? await claude.use("sample") : null; } catch(x) { sample = null; }
  if(!RD || RD.id !== id) return;
  if(!sample){ RD.err = T("rd_noai"); readView(); return; }
  try {
    var r = await sample(readPrompt(kind, task), { modelTier: "default", cache: false });
    if(!RD || RD.id !== id) return;
    var t = String(r.text || "").replace(/```json|```/g, ""), i = t.indexOf("{"), j = t.lastIndexOf("}");
    var d = JSON.parse(t.slice(i, j + 1));
    if(!d.text || !Array.isArray(d.questions) || !d.questions.length) throw new Error("bad");
    d.questions.forEach(function(q){
      if(Array.isArray(q.options)){ if(typeof q.answer !== "number") throw new Error("bad"); }
      else if(q.answer === undefined) throw new Error("bad");
    });
    RD.data = d;
  } catch(err) {
    if(!RD || RD.id !== id) return;
    RD.err = (err && err.code === "not_granted") ? T("rd_deny") : T("rd_err");
  }
  if(screen === "reading") readView();
}

function normA(x){ return String(x).toLowerCase().replace(/[^a-z0-9\u00c0-\u024f ]/g, "").replace(/\s+/g, " ").trim(); }
function accepted(q){ return (Array.isArray(q.answer) ? q.answer : [q.answer]).map(normA); }
function isRight(q, i){
  var v = RD.sel[i];
  if(Array.isArray(q.options)) return v === q.answer;
  return v !== undefined && accepted(q).indexOf(normA(v)) >= 0;
}
function optLabel(oi){
  var t = RD.task;
  if(t === "mcq" || t === "gapped") return String.fromCharCode(65 + oi) + ". ";
  if(t === "headings") return ["i","ii","iii","iv","v","vi","vii","viii"][oi] + ". ";
  return "";
}

function readView(){
  screen = "reading";

  var h = '<div class="top"><button class="btn ghost" id="back">'+T("back")+'</button><span class="prog">'+kn+' · '+NAMES[RD.task]+' · '+(RD.data&&RD.data.lv?RD.data.lv:level+'-level')+'</span></div>';

    h += '<div class="passage"><h2>'+esc(show(d.title || kn+" Reading"))+'</h2>'+(d.ins?'<p class="sub">'+esc(d.ins)+'</p>':'') + String(d.text).split(/\n\s*\n/).map(function(p, pi){ return '<p>'+(lab ? '<b>'+String.fromCharCode(65+pi)+'</b> ' : '')+esc(show(p.trim()))+'</p>'; }).join("") + '</div>';
    d.questions.forEach(function(q, qi){
      var ok = RD.checked && isRight(q, qi);
      h += '<div class="q"><b>'+(qi+1)+'. '+esc(show(q.q))+'</b>';
      if(Array.isArray(q.options) && q.options.length <= 4){
        q.options.forEach(function(o, oi){
          var cls = "opt";
          if(RD.checked){ if(oi === q.answer) cls += " ok"; else if(RD.sel[qi] === oi) cls += " bad"; }
          else if(RD.sel[qi] === oi) cls += " sel";
          h += '<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'+optLabel(oi)+esc(show(String(o)))+'</button>';
        });
      } else if(Array.isArray(q.options)){
        h += '<select class="sl'+(RD.checked ? (ok ? ' ok' : ' bad') : '')+'" data-q="'+qi+'"'+(RD.checked ? ' disabled' : '')+'><option value="">—</option>';
        q.options.forEach(function(o, oi){ h += '<option value="'+oi+'"'+(RD.sel[qi] === oi ? ' selected' : '')+'>'+optLabel(oi)+esc(show(String(o)))+'</option>'; });
        h += '</select>';

        h += '<input class="tx'+(RD.checked ? (ok ? ' ok' : ' bad') : '')+'" data-q="'+qi+'" placeholder="'+T("rd_tx")+'" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(RD.sel[qi] || "")+'"'+(RD.checked ? ' disabled' : '')+'>';
      }
      if(RD.checked){
        var corr = Array.isArray(q.options) ? optLabel(q.answer) + String(q.options[q.answer]) : (Array.isArray(q.answer) ? q.answer.join(" / ") : String(q.answer));
        h += '<p class="why">'+(ok ? '✓ ' : '✗ '+T("ans")+': '+esc(show(corr))+'. ')+esc(show(q.why || ""))+'</p>';
      }
      h += '</div>';
    });
    if(RD.checked){
      var n = d.questions.filter(function(q, i){ return isRight(q, i); }).length;
      h += '<div class="score">'+T("score")+': '+n+' / '+d.questions.length+'</div><div class="nav"><button class="btn" id="rn">'+T("rd_new")+'</button></div>';
    } else {
      h += '<div class="nav"><button class="btn" id="rc" hidden>'+T("rd_check")+'</button></div>';
    }
  }
  app.innerHTML = h;
  document.getElementById("back").onclick = function(){ var k = RD.kind; RD = null; readPick(k); };
  var rn = document.getElementById("rn"); if(rn) rn.onclick = function(){ readStart(RD.kind, RD.pick); };
  if(!RD.data || RD.checked) return;
  var rc = document.getElementById("rc");
  function allDone(){ return RD.data.questions.every(function(q, i){ return RD.sel[i] !== undefined; }); }
  function upd(){ rc.hidden = !allDone(); }
  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){
      var qi = +b.dataset.q, oi = +b.dataset.o;
      RD.sel[qi] = oi; sndTap();
      app.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(function(x){ x.classList.toggle("sel", +x.dataset.o === oi); });
      upd();
    };
  });
  app.querySelectorAll("select.sl").forEach(function(el){
    el.onchange = function(){ RD.sel[+el.dataset.q] = el.value === "" ? undefined : +el.value; upd(); };
  });
  app.querySelectorAll("input.tx").forEach(function(el){
    el.oninput = function(){ var v = el.value.trim(); RD.sel[+el.dataset.q] = v ? v : undefined; upd(); };
  });
  rc.onclick = function(){ RD.checked = true; readView(); window.scrollTo(0, 0); };
  upd();
}

function next(){
  if(!deck.length){
    var last = cur ? cur.w : "";
    deck = shuffle(WORDS[level]);
    if(deck.length > 1 && deck[deck.length-1].w === last){ deck.unshift(deck.pop()); }
  }
  cur = deck.pop();
  dir = mode === "mix" ? (Math.random() < 0.5 ? "en" : "uz") : mode;
  done = false; firstTry = true;
  study();
}

function study(){
  if(mode === "use") return useScreen();
  screen = "study";
  var q = dir === "en" ? cur.w : cur.t, a = dir === "en" ? cur.t : cur.w;
  var h = '<div class="top"><button class="btn ghost" id="back">'+T("back")+'</button></div>';
  h += '<div class="card"><div class="prog">'+(dir==="en"?T("toUz"):T("toEn"))+'</div>';
  h += '<div class="word">'+esc(show(q))+'</div>';
  if(dir === "en" || done) h += '<button class="spk" id="spk" aria-label="'+T("pron")+'">🔊</button>';
  h += '<div class="ans">'+(done?esc(show(a)):'')+'</div></div>';
  if(!done){
    h += '<div class="row"><input id="inp" placeholder="'+T("ph")+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>';
    h += '<div class="msg" id="msg"></div><div class="nav"><button class="btn ghost" id="dk">'+T("dk")+'</button></div>';
  } else {
    h += '<div class="msg" id="msg"></div><div class="nav"><button class="btn" id="nx">'+T("next")+'</button></div>';
  }
  app.innerHTML = h;
  bindEssay();
  document.getElementById("back").onclick = wordHome;
  var sp = document.getElementById("spk");
  if(sp) sp.onclick = function(){ speak(cur.w); };
  var msg = document.getElementById("msg");
  if(done){
    msg.className = "msg " + (firstTry ? "ok" : "bad");
    msg.textContent = firstTry ? T("ok") : T("bad");
    document.getElementById("nx").onclick = next;
    return;
  }
  var inp = document.getElementById("inp");
  function check(){
    var v = norm(inp.value); inp.classList.remove("wrong"); if(!v) return;
    var ok = a.split(",").some(function(x){ return norm(x) === v; });
    if(ok){
      if(firstTry){ known[cur.w] = 1; session++; save(); }
      sndOk();
      next();
    } else if(v.length >= norm(a.split(",")[0]).length){
      inp.classList.add("wrong");
      if(firstTry){ firstTry = false; delete known[cur.w]; save(); wrongFeedback(); }
    }
  }
  inp.oninput = check;
  inp.focus();
  document.getElementById("dk").onclick = function(){ firstTry = false; delete known[cur.w]; save(); wrongFeedback(); done = true; study(); };
}

window.addEventListener("keydown", function(e){
  if(e.key === "Enter" && done && screen === "study"){ var n = document.getElementById("nx"); if(n) n.click(); }
});

"Sleep also plays a central role in memory. In one well-known experiment, volunteers who slept after studying a list of words recalled significantly more of them the next day than those who stayed awake. Researchers believe that the brain uses sleep to transfer new information into long-term storage.",
"Despite this, many people sleep far less than they need. Surveys suggest that a third of adults in industrialised countries regularly get under seven hours, partly because of artificial light and the habit of checking phones in bed. Chronic lack of sleep is linked to obesity, heart disease and reduced concentration.",
"Sleep specialists therefore recommend a regular bedtime, a cool, dark bedroom and avoiding caffeine in the afternoon. They also warn against catching up at weekends, since irregular patterns may disturb the body's internal clock."],

    r.setProperty("--px", (e.clientX/innerWidth - .5).toFixed(3));
    r.setProperty("--py", (e.clientY/innerHeight - .5).toFixed(3));
  }, {passive:true});

  /* 3D qiyalash (kompyuterda ustiga borganda) */
  document.addEventListener("pointermove", function(e){
    if(reduced() || e.pointerType !== "mouse") return;
    var t = e.target, el = t && t.closest ? t.closest(".lv,.rd") : null;
    if(!el) return;
    var r = el.getBoundingClientRect();
    el.style.setProperty("--ry", (((e.clientX-r.left)/r.width - .5)*10).toFixed(2)+"deg");
    el.style.setProperty("--rx", ((.5 - (e.clientY-r.top)/r.height)*8).toFixed(2)+"deg");
  }, {passive:true});
  document.addEventListener("pointerout", function(e){
    var t = e.target, el = t && t.closest ? t.closest(".lv,.rd") : null;
    if(el && (!e.relatedTarget || !el.contains(e.relatedTarget))){ el.style.removeProperty("--rx"); el.style.removeProperty("--ry"); }
  });

  /* So'z harflari birin-ketin chiqadi */
  function splitWord(){
    var w = app && app.querySelector(".word");
    if(!w || w.getAttribute("data-fx") || reduced()) return;
    w.setAttribute("data-fx", "1");
    var txt = w.textContent; if(!txt || txt.length > 40) return;
    w.setAttribute("aria-label", txt);
    w.textContent = "";
    for(var i = 0; i < txt.length; i++){
      var c = txt.charAt(i);
      if(c === " "){ w.appendChild(document.createTextNode(" ")); continue; }
      var s = document.createElement("span"); s.className = "ch"; s.setAttribute("aria-hidden", "true");
      s.style.setProperty("--i", i); s.textContent = c; w.appendChild(s);
    }
  }
  if(app && window.MutationObserver){ new MutationObserver(splitWord).observe(app, {childList:true}); splitWord(); }
})();
</script>

<script>
/* Mening so'zlarim: foydalanuvchi o'z so'zlarini yozadi, tarjima qiladi va mavjud rejimlarda yodlaydi */
(function(){
  var app = document.getElementById("app");
  var MY = {active:false, dir:"auto", list:[], newW:null, cur:null, tok:0, busy:false};
  try { var sv = JSON.parse(localStorage.getItem("mywords") || "[]"); if(Array.isArray(sv)) MY.list = sv.filter(function(x){ return x && typeof x.w === "string" && typeof x.t === "string"; }); } catch(e){}
  function persist(){ try { localStorage.setItem("mywords", JSON.stringify(MY.list)); } catch(e){} }
  function U(a, b){ return S.lang === "uz" ? a : b; }
  function clean(s){ return String(s).replace(/[’ʻʼ`‘]/g, "'").replace(/\s+/g, " ").trim(); }
  function $(id){ return document.getElementById(id); }

  /* Kirill -> lotin */
  var CY = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"'","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o'","қ":"q","ғ":"g'","ҳ":"h"};
  function lat(s){ return s.toLowerCase().replace(/[\u0400-\u04FF]/g, function(c){ return CY[c] !== undefined ? CY[c] : c; }); }
  function hasCy(s){ return /[\u0400-\u04FF]/.test(s); }

  /* Ichki lug'at indeksi (1-20 daraja) */
  var IDX = null;
  function index(){
    if(IDX) return IDX; IDX = {en:{}, uz:{}};
    for(var L = 1; L <= 20; L++){ (WORDS[L] || []).forEach(function(x){
      IDX.en[norm(x.w)] = x.t;
      x.t.split(",").forEach(function(a){ var k = norm(a); if(k && !IDX.uz[k]) IDX.uz[k] = x.w; });
    }); }
    return IDX;
  }
  function detect(q){
    var k = norm(q), I2 = index();
    if(I2.en[k]) return "en"; if(I2.uz[k]) return "uz";
    if(hasCy(q) || /[oOgG]['’ʻʼ`‘]|[ʻʼ]/.test(q)) return "uz";
    return "en";
  }
  function fix(t, q){
    t = String(t).trim(); if(hasCy(t)) t = lat(t);
    if(q === q.toLowerCase()) t = t.toLowerCase();
    if(!/[.!?]$/.test(q)) t = t.replace(/[.!?]+$/, "");
    return clean(t);
  }
  function online(q, dir){
    var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function(){ if(ctl) ctl.abort(); }, 9000);
    var lp = dir === "en" ? "en|uz" : "uz|en";
    return fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + encodeURIComponent(lp), ctl ? {signal:ctl.signal} : {})
      .then(function(r){ clearTimeout(to); if(!r.ok) throw new Error("http"); return r.json(); })
      .then(function(j){
        var t = j && j.responseData && j.responseData.translatedText;
        if(!t || /MYMEMORY WARNING|INVALID/i.test(t)) throw new Error("bad");
        var out = [fix(t, q)], seen = {}; seen[norm(out[0])] = 1;
        (j.matches || []).forEach(function(m){
          if(out.length >= 3 || !m || !m.translation || !m.segment || norm(m.segment) !== norm(q)) return;
          var v = fix(m.translation, q), k = norm(v);
          if(v && !seen[k] && v.split(" ").length <= Math.max(3, q.split(" ").length + 1)){ seen[k] = 1; out.push(v); }
        });
        return out.join(", ");
      });
  }

  /* Natija oynasi */
  function showLoading(){ $("myres").innerHTML = '<div class="mw-load">'+U("Tarjima qilinmoqda","Translating")+'<span class="dots"><i></i><i></i><i></i></span></div>'; }
  function showResult(tr, note){
    var c = MY.cur, en = c.dir === "en";
    $("myres").innerHTML = '<div class="panel mw-res"><div class="mw-dir"><span>'+(en?"EN → UZ":"UZ → EN")+'</span><button class="btn ghost" id="mwswap" type="button" style="padding:6px 14px" aria-label="Swap">⇄</button></div>'
      + '<div class="mw-src"><b>'+esc(show(c.src))+'</b>'+(en?'<button class="spk" id="mwspk" type="button" style="width:40px;height:40px;font-size:18px" aria-label="Speak">🔊</button>':'')+'</div>'
      + '<input id="mwtr" value="'+esc(tr)+'" placeholder="'+(en?U("O’zbekcha tarjima","Uzbek translation"):U("Inglizcha tarjima","English translation"))+'" autocomplete="off" autocapitalize="off" spellcheck="false">'
      + '<p class="why">'+note+'</p><div class="nav"><button class="btn" id="mwadd" type="button">'+U("Qo’shish","Add")+'</button></div></div>';
    $("mwswap").onclick = function(){ sndTap(); go(en ? "uz" : "en"); };
    var sp = $("mwspk"); if(sp) sp.onclick = function(){ speak(c.src); };
    $("mwadd").onclick = add;
    $("mwtr").onkeydown = function(e){ if(e.key === "Enter") add(); };
    if(!tr) $("mwtr").focus();
  }
  function go(force){
    var q = clean($("mwin").value); if(!q) { $("mwin").focus(); return; }
    var dir = force || (MY.dir === "auto" ? detect(q) : MY.dir), tok = ++MY.tok, I2 = index(), k = norm(q);
    MY.cur = {src:q, dir:dir};
    var d = dir === "en" ? I2.en[k] : I2.uz[k];
    if(d){ showResult(d, U("Ichki lug’atdan","From the built-in dictionary")); return; }
    showLoading();
    var auto = !force && MY.dir === "auto";
    online(q, dir).then(function(tr){
      if(auto && norm(tr) === k){ MY.cur.dir = dir === "en" ? "uz" : "en"; return online(q, MY.cur.dir); }
      return tr;
    }).then(function(tr){ if(tok !== MY.tok) return; showResult(tr, U("Onlayn tarjima. Kerak bo’lsa tahrirlang","Online translation. Edit it if needed")); })
      .catch(function(){ if(tok !== MY.tok) return; showResult("", U("Tarjima topilmadi (internet yo’q bo’lishi mumkin). Tarjimani o’zingiz yozing","Couldn’t translate (you may be offline). Type the translation yourself")); });
  }
  function add(){
    var c = MY.cur; if(!c) return;
    var tr = clean($("mwtr").value); if(!tr){ $("mwtr").focus(); return; }
    var en, uz;
    if(c.dir === "en"){ en = c.src; uz = tr; } else { uz = c.src; en = tr.split(",")[0]; }
    en = clean(en); uz = clean(hasCy(uz) ? lat(uz) : uz);
    if(!en || !uz) return;
    var k = norm(en), f = -1; MY.list.forEach(function(x, i){ if(norm(x.w) === k) f = i; });
    if(f >= 0){ MY.list.splice(f, 1); }
    MY.list.unshift({w:en, t:uz}); persist();
    MY.newW = en; MY.cur = null; MY.tok++;
    $("mwin").value = "";
    $("myres").innerHTML = '<div class="msg ok">'+U("Qo’shildi ✓","Added ✓")+'</div>';
    sndTap(); renderList(); $("mwin").focus();
  }

  /* Saqlangan so'zlar ro'yxati */
  function renderList(){
    var n = MY.list.length, box = $("mylist"); if(!box) return;
    var h = '<p class="sub" style="margin:22px 0 8px"><b>'+U("Saqlangan so’zlar","Saved words")+' ('+n+')</b></p>';
    if(!n) h += '<div class="empty">'+U("Hali so’z yo’q","No words yet")+'</div>';
    MY.list.forEach(function(x, i){
      h += '<div class="mw-item'+(x.w === MY.newW ? ' new' : '')+'" style="animation-delay:'+(Math.min(i, 10)*35)+'ms"><div class="mw-main"><b class="mw-w">'+esc(show(x.w))+'</b><span class="mw-t">'+esc(show(x.t))+'</span></div>'
        + '<button class="mw-b" data-sp="'+i+'" type="button" aria-label="Speak">🔊</button><button class="mw-b x" data-x="'+i+'" type="button" aria-label="Delete">✕</button></div>';
    });
    box.innerHTML = h; MY.newW = null;
    box.querySelectorAll("[data-sp]").forEach(function(b){ b.onclick = function(){ speak(MY.list[+b.dataset.sp].w); }; });
    box.querySelectorAll("[data-x]").forEach(function(b){ b.onclick = function(){
      if(MY.busy) return; MY.busy = true; sndTap();
      var it = b.closest(".mw-item"); if(it) it.classList.add("out");
      setTimeout(function(){ MY.list.splice(+b.dataset.x, 1); persist(); MY.busy = false; renderList(); }, 260);
    }; });
    document.querySelectorAll("#mystudy .lv").forEach(function(b){ b.disabled = !n; });
  }

  /* Yodlashni boshlash: mavjud o'rganish mexanizmidan foydalanadi */
  function study(m){
    if(!MY.list.length) return; sndTap();
    WORDS[99] = MY.list.map(function(x){ return {w:x.w, t:x.t}; });
    MY.active = true; level = 99; deck = []; session = 0; mode = m; next();
  }

  function myScreen(){
    MY.active = true; screen = "myw"; level = 0; MY.cur = null; MY.tok++;
    try { clearInterval(tmr); } catch(e){}
    var h = '<div class="top"><button class="btn ghost" id="back">'+T("back")+'</button><span class="prog">'+U("Mening so’zlarim","My words")+'</span></div>'
      + '<h1>'+U("Mening so’zlarim","My words")+'</h1><p class="sub">'+U("Inglizcha yoki o’zbekcha so’z yozing, tarjima qiling va yodlang","Write an English or Uzbek word, translate it and learn it")+'</p>'
      + '<div class="row" style="margin-top:0"><input id="mwin" placeholder="'+U("So’z yozing","Type a word")+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" id="mwgo" type="button">'+U("Tarjima","Translate")+'</button></div>'
      + '<div class="seg" id="mwseg" style="margin-top:10px">'
      + [["auto","Auto"],["en","EN → UZ"],["uz","UZ → EN"]].map(function(d){ return '<button type="button" data-d="'+d[0]+'" class="'+(MY.dir === d[0] ? "on" : "")+'">'+d[1]+'</button>'; }).join("")
      + '</div><div id="myres"></div>'
      + '<p class="sub" style="margin:22px 0 8px"><b>'+U("Yodlash","Practice")+'</b></p>'
      + '<div class="levels" id="mystudy"><button class="lv" data-m="en"><b>'+T("m_en")+'</b></button><button class="lv" data-m="uz"><b>'+T("m_uz")+'</b></button><button class="lv" data-m="mix"><b>'+T("m_mix")+'</b></button><button class="lv" data-m="use"><b>'+T("m_use")+'</b></button></div>'
      + '<div id="mylist"></div>';
    app.innerHTML = h;
    $("back").onclick = function(){ home(); };
    $("mwgo").onclick = function(){ sndTap(); go(); };
    $("mwin").onkeydown = function(e){ if(e.key === "Enter") go(); };
    app.querySelectorAll("#mwseg button").forEach(function(b){ b.onclick = function(){
      MY.dir = b.dataset.d; sndTap();
      app.querySelectorAll("#mwseg button").forEach(function(x){ x.classList.toggle("on", x === b); });
    }; });
    app.querySelectorAll("#mystudy .lv").forEach(function(b){ b.onclick = function(){ study(b.dataset.m); }; });
    renderList();
  }

  /* Mavjud ekranlarga ulanish (asl funksiyalar o'z holicha qoladi) */
  function addHomeBtn(){
    var m = app.querySelector(".modes"); if(!m || m.querySelector('[data-k="my"]')) return;
    var b = document.createElement("button"); b.className = "lv"; b.setAttribute("data-k", "my");
    b.innerHTML = '<b>'+U("Mening so’zlarim","My words")+'</b><span>'+U("O’z so’zlaringizni tarjima qilib yodlang","Translate your own words and learn them")+'</span>';
    b.onclick = function(){ sndTap(); myScreen(); };
    m.appendChild(b);
  }
  var _home = window.home;
  window.home = function(){ MY.active = false; var r = _home.apply(this, arguments); addHomeBtn(); return r; };
  var _wh = window.wordHome;
  window.wordHome = function(){ if(MY.active) return myScreen(); return _wh.apply(this, arguments); };
  var _render = window.render;
  window.render = function(){ if(MY.active && screen === "myw") return myScreen(); return _render.apply(this, arguments); };
  if(screen === "home") addHomeBtn();
})();
</script>
</body>
